<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에스피시스템스 마케팅 허브</title>
<meta name="description" content="에스피시스템스 회사소개서, 홍보 영상, 자동화 구축 사례 영상과 공개 자료를 한 곳에서 확인하세요.">
<meta property="og:title" content="에스피시스템스 마케팅 허브">
<meta property="og:description" content="회사소개서 · 홍보 영상 · 자동화 구축 사례 · 공개 자료">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Archivo:wght@500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  color-scheme:light;
  --canvas:#EAEFF5; --surface:#FFFFFF; --surface-2:#F7FAFD; --surface-3:#EEF3F9;
  --ink:#13213D; --ink-2:#46607F; --ink-3:#7E94AD;
  --line:#D8E3F0; --line-2:#EAF1F9;
  --brand:#152C7C; --brand-2:#1A7CC8; --brand-ink:#14508C;
  --brand-bg:#E4EDFB; --brand-line:#BFD6F2;
  --hdr-bg:linear-gradient(135deg,#2BA0DC 0%,#1A7CC8 45%,#152C7C 100%);
  --hdr-sub:#CDE9FA; --hdr-faint:#A9D4F2;
  --hdr-ctl:rgba(255,255,255,.14); --hdr-ctl-line:rgba(255,255,255,.28);
  --ok:#1E7A3C; --ok-bg:#E4F2E8; --ok-line:#BBDFC8;
  --info:#1E93D4; --info-bg:#E2F1FA; --info-line:#BEE0F3;
  --hold:#E08A00; --hold-bg:#FFF1CC; --hold-line:#F2DCA0;
  --late:#C13B2E; --late-bg:#FBE6E3; --late-line:#F1C4BD;
  --lift:rgba(21,44,124,.10);
  --shadow:0 1px 2px rgba(20,32,46,.04),0 4px 16px rgba(20,32,46,.06);
  --sans:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --num:"Archivo","Noto Sans KR",system-ui,sans-serif;
  --wrap:1320px; --rail:330px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --canvas:#161D29; --surface:#1B2331; --surface-2:#212A39; --surface-3:#28323F;
    --ink:#F4F7FB; --ink-2:#D2DCE8; --ink-3:#A8B6C7;
    --line:#36424F; --line-2:#2A3543;
    --brand:#3F6BD8; --brand-2:#4F95E8; --brand-ink:#8FBDF2;
    --brand-bg:#1C2C4A; --brand-line:#2F4A73;
    --hdr-bg:linear-gradient(120deg,#121A28 0%,#1B2737 100%);
    --hdr-sub:#C2D5EA; --hdr-faint:#9DB6D8;
    --hdr-ctl:rgba(255,255,255,.10); --hdr-ctl-line:rgba(255,255,255,.20);
    --ok:#3DA85C; --ok-bg:#1C3A28; --ok-line:#2C5A3C;
    --info:#62C8F0; --info-bg:#143447; --info-line:#1E4A63;
    --hold:#F2B452; --hold-bg:#3D2F14; --hold-line:#5A4520;
    --late:#FF8175; --late-bg:#46221E; --late-line:#63322C;
    --lift:rgba(0,0,0,.45);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#161D29; --surface:#1B2331; --surface-2:#212A39; --surface-3:#28323F;
  --ink:#F4F7FB; --ink-2:#D2DCE8; --ink-3:#A8B6C7;
  --line:#36424F; --line-2:#2A3543;
  --brand:#3F6BD8; --brand-2:#4F95E8; --brand-ink:#8FBDF2;
  --brand-bg:#1C2C4A; --brand-line:#2F4A73;
  --hdr-bg:linear-gradient(120deg,#121A28 0%,#1B2737 100%);
  --hdr-sub:#C2D5EA; --hdr-faint:#9DB6D8;
  --hdr-ctl:rgba(255,255,255,.10); --hdr-ctl-line:rgba(255,255,255,.20);
  --ok:#3DA85C; --ok-bg:#1C3A28; --ok-line:#2C5A3C;
  --info:#62C8F0; --info-bg:#143447; --info-line:#1E4A63;
  --hold:#F2B452; --hold-bg:#3D2F14; --hold-line:#5A4520;
  --late:#FF8175; --late-bg:#46221E; --late-line:#63322C;
  --lift:rgba(0,0,0,.45);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.5);
}

body{
  margin:0; background:var(--canvas); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,dl,dd,figure{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:var(--brand-ink)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--brand-2); outline-offset:2px; border-radius:2px}

.hdr{background:var(--hdr-bg); color:#fff}
.hdr__in{
  max-width:var(--wrap); margin:0 auto; padding-block:1.05rem; padding-inline:22px;
  display:flex; align-items:center; gap:1.25rem; flex-wrap:wrap;
}
.hdr__brand{display:flex; align-items:center; gap:.85rem; min-width:0}
.hdr__mark{
  width:42px; height:42px; border-radius:6px; flex:none; overflow:hidden;
  display:grid; place-items:center; background:rgba(255,255,255,.16);
  border:1px solid var(--hdr-ctl-line);
  font-family:var(--num); font-size:.9375rem; font-weight:700; color:#fff;
}
.hdr__mark img{width:100%; height:100%; object-fit:contain; background:#fff}
.hdr h1{font-size:1.125rem; font-weight:700; letter-spacing:-.015em; line-height:1.3}
.hdr__sub{font-size:.75rem; color:var(--hdr-sub); margin-top:.1rem}
.hdr__sub .stamp{font-family:var(--num); color:var(--hdr-faint)}
.hdr__tools{margin-left:auto; display:flex; align-items:center; gap:.5rem; flex-wrap:wrap}
.hbtn{
  font-family:inherit; font-size:.75rem; font-weight:600; line-height:1; cursor:pointer;
  padding:.6em .9em; border-radius:5px; color:#fff;
  background:var(--hdr-ctl); border:1px solid var(--hdr-ctl-line);
}
.hbtn:hover{background:rgba(255,255,255,.24)}
.hbtn[aria-pressed="true"]{background:#fff; color:var(--brand); border-color:#fff}

.seg{display:flex; gap:2px; padding:2px; border-radius:6px; background:var(--surface-3); border:1px solid var(--line)}
.seg button{
  font-family:inherit; font-size:.75rem; font-weight:600; line-height:1; white-space:nowrap;
  padding:.62em .9em; border:0; border-radius:4px; background:transparent; color:var(--ink-2); cursor:pointer;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{
  background:var(--surface); color:var(--brand-ink); box-shadow:0 1px 2px var(--lift);
}
.seg--hdr{background:var(--hdr-ctl); border-color:var(--hdr-ctl-line)}
.seg--hdr button{color:var(--hdr-sub)}
.seg--hdr button:hover{color:#fff}
.seg--hdr button[aria-pressed="true"]{background:#fff; color:var(--brand); box-shadow:none}

.vbar{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30}
.vbar__in{
  max-width:var(--wrap); margin:0 auto; padding-block:.7rem; padding-inline:22px;
  display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
}
.vbar__a{margin-left:auto; display:flex; gap:.4rem; align-items:center}

.wrap{max-width:var(--wrap); margin:0 auto; padding-inline:22px; padding-block:1.25rem 3rem}
.view{display:grid; gap:1rem}
.view[hidden]{display:none}
.split{display:grid; gap:1rem; grid-template-columns:minmax(0,1fr) var(--rail); align-items:start}
.col,.rail{display:grid; gap:1rem; min-width:0}

.banner{
  display:flex; gap:.75rem; align-items:center; flex-wrap:wrap;
  padding:.7rem .95rem; border-radius:6px; margin-bottom:1rem;
  border:1px solid var(--info-line); background:var(--info-bg); color:var(--ink-2); font-size:.8125rem;
}
.banner strong{color:var(--ink)}
.banner--warn{border-color:var(--hold-line); background:var(--hold-bg)}
.banner__sp{margin-left:auto}

.card{background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); overflow:hidden}
.card__h{
  display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
  padding:.85rem 1.05rem; border-bottom:1px solid var(--line-2); background:var(--surface-2);
}
.card__h h2{font-size:.875rem; font-weight:700; letter-spacing:-.01em}
.card__m{font-family:var(--num); font-size:.6875rem; font-weight:500; color:var(--ink-3)}
.adminlab{
  font-family:var(--num); font-size:.625rem; font-weight:600; letter-spacing:.05em;
  color:var(--brand-ink); background:var(--brand-bg); border:1px solid var(--brand-line);
  padding:.25em .45em; border-radius:3px; white-space:nowrap;
}
.card__a{margin-left:auto; display:flex; gap:.4rem; flex-wrap:wrap; align-items:center}
.card__b{padding:1.05rem}

.btn{
  font-family:inherit; font-size:.75rem; font-weight:600; line-height:1; cursor:pointer;
  display:inline-flex; align-items:center; gap:.4em; text-decoration:none;
  padding:.62em .9em; border-radius:5px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  transition:background .13s ease,border-color .13s ease;
}
.btn:hover{background:var(--surface-3); border-color:var(--ink-3)}
.btn--primary{background:var(--brand-2); border-color:var(--brand-2); color:#fff}
.btn--primary:hover{background:var(--brand); border-color:var(--brand)}
.btn--ghost{background:transparent; border-color:transparent; color:var(--ink-2); padding:.55em .65em}
.btn--ghost:hover{background:var(--surface-3); color:var(--ink)}
.btn--danger{color:var(--late)}
.btn--danger:hover{border-color:var(--late)}
.btn[disabled]{opacity:.42; cursor:default}

.chip{
  display:inline-block; font-size:.6875rem; font-weight:600; padding:.4em .65em;
  border-radius:999px; background:var(--surface-3); border:1px solid var(--line); color:var(--ink-2);
}
.hint{font-size:.75rem; color:var(--ink-3)}
.empty{
  padding:2.5rem 1.25rem; text-align:center; color:var(--ink-3); font-size:.8125rem;
  background:var(--surface-2); border:1px dashed var(--line); border-radius:6px;
}
.empty p{margin-bottom:.85rem}

.tiles{display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.tile{
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  box-shadow:var(--shadow); padding:1rem 1.05rem 1.1rem; position:relative; overflow:hidden;
}
.tile::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--brand-2)}
.tile__l{font-size:.75rem; font-weight:600; color:var(--ink-2)}
.tile__v{
  font-family:var(--num); font-size:clamp(1.55rem,2.7vw,1.95rem); font-weight:700;
  letter-spacing:-.025em; line-height:1.15; margin-top:.35rem;
  display:flex; align-items:baseline; gap:.18em;
}
.tile__u{font-family:var(--sans); font-size:.8125rem; font-weight:600; color:var(--ink-3)}
.tile__n{font-family:var(--num); font-size:.6875rem; font-weight:500; color:var(--ink-3); margin-top:.3rem}

.lede{font-size:.9375rem; font-weight:600; color:var(--ink); letter-spacing:-.01em; text-wrap:balance}
.para{font-size:.8125rem; color:var(--ink-2); margin-top:.6rem}
.chips{display:flex; gap:.35rem; flex-wrap:wrap; margin-top:.85rem}
.quick{display:grid; gap:.4rem; margin-top:1rem; padding-top:.9rem; border-top:1px solid var(--line-2)}
.spec{display:grid}
.spec>div{display:grid; grid-template-columns:78px minmax(0,1fr); gap:.6rem; padding:.5rem 0; border-top:1px solid var(--line-2)}
.spec>div:first-child{border-top:0; padding-top:0}
.spec dt{font-family:var(--num); font-size:.6875rem; font-weight:600; color:var(--ink-3); padding-top:.1rem}
.spec dd{font-size:.8125rem; word-break:break-word}

.viewer{border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--surface-2)}
.viewer iframe{display:block; width:100%; height:min(76vh,860px); border:0; background:var(--surface)}
.viewer__fall{padding:3.5rem 1.5rem; text-align:center; color:var(--ink-3); font-size:.8125rem}
.meta{font-family:var(--num); font-size:.6875rem; font-weight:500; color:var(--ink-3); margin-top:.3rem}
.acts{display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.85rem}
.frow{display:flex; align-items:center; gap:.6rem; padding:.55rem 0; border-top:1px solid var(--line-2); font-size:.8125rem}
.frow:first-child{border-top:0; padding-top:0}
.frow__n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.frow__s{font-family:var(--num); font-size:.6875rem; color:var(--ink-3); flex:none}

.vids{display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(298px,1fr))}
.vid{border:1px solid var(--line); border-radius:6px; background:var(--surface); overflow:hidden; display:flex; flex-direction:column}
.vid__stage{
  position:relative; aspect-ratio:16/9; width:100%; max-width:100%; overflow:hidden;
  background:linear-gradient(150deg,var(--surface-3) 0%,var(--surface-2) 100%);
  display:grid; place-items:center; border:0; padding:0; cursor:pointer;
}
.vid__stage img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.vid__play{
  position:relative; z-index:1; width:52px; height:52px; border-radius:50%;
  background:var(--brand-2); color:#fff; display:grid; place-items:center;
  box-shadow:0 6px 18px -6px rgba(0,0,0,.6); transition:transform .16s ease;
}
.vid__stage:hover .vid__play{transform:scale(1.08)}
.vid__stage iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.vid__b{padding:.85rem 1rem .95rem; display:flex; flex-direction:column; gap:.22rem; flex:1}
.vid__b h3{font-size:.875rem; font-weight:700; letter-spacing:-.01em}
.vid__b p{font-size:.75rem; color:var(--ink-2)}
.vid__f{display:flex; align-items:center; gap:.5rem; margin-top:auto; padding-top:.7rem; flex-wrap:wrap}
.vid__f a{font-size:.75rem; font-weight:600; text-decoration:none}
.vid__f a:hover{text-decoration:underline}
.subh{display:flex; align-items:center; gap:.6rem; margin-bottom:.8rem}
.subh h3{font-size:.8125rem; font-weight:700}

.tblwrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.8125rem}
.t--files{min-width:700px}
thead th{
  text-align:left; font-family:var(--num); font-size:.6875rem; font-weight:600;
  letter-spacing:.03em; color:var(--ink-3); background:var(--surface-2);
  padding:.65rem .85rem; border-bottom:1px solid var(--line); white-space:nowrap;
}
tbody td{padding:.7rem .85rem; border-top:1px solid var(--line-2); vertical-align:top}
tbody tr:first-child td{border-top:0}
tbody tr:hover{background:var(--surface-2)}
.c-name{font-weight:700; color:var(--ink)}
.c-num{font-family:var(--num); font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right}
.c-act{width:1%; white-space:nowrap; text-align:right}
.tfootbar{
  display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
  padding:.7rem 1.05rem; border-top:1px solid var(--line); background:var(--surface-2);
  font-family:var(--num); font-size:.6875rem; font-weight:500; color:var(--ink-3);
}
.ext{
  display:inline-block; font-family:var(--num); font-size:.625rem; font-weight:700;
  letter-spacing:.04em; padding:.28em .45em; border-radius:3px;
  background:var(--brand-bg); color:var(--brand-ink); border:1px solid var(--brand-line);
}

.scrim{position:fixed; inset:0; z-index:80; background:rgba(10,18,32,.62); display:grid; place-items:center; padding:20px}
.modal{
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  width:min(640px,100%); max-height:88vh; display:flex; flex-direction:column; box-shadow:var(--shadow);
}
.modal__h{display:flex; align-items:center; gap:.75rem; padding:.95rem 1.15rem; border-bottom:1px solid var(--line)}
.modal__h h3{font-size:.9375rem; font-weight:700}
.modal__h .btn{margin-left:auto}
.modal__b{padding:1.15rem; overflow-y:auto; display:grid; gap:.95rem}
.modal__f{display:flex; gap:.5rem; padding:.9rem 1.15rem; border-top:1px solid var(--line); align-items:center}
.modal__sp{margin-left:auto}
.fld{display:grid; gap:.28rem}
.fld>label{font-size:.75rem; font-weight:600; color:var(--ink-2)}
.fld input,.fld select,.fld textarea,.inp{
  font-family:inherit; font-size:.8125rem; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line); border-radius:5px; padding:.62em .7em; width:100%;
}
.fld textarea{min-height:78px; resize:vertical; line-height:1.6}
.fld__h{font-size:.6875rem; color:var(--ink-3)}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:90;
  background:var(--ink); color:var(--surface); font-size:.8125rem; padding:.7rem 1.1rem;
  border-radius:6px; box-shadow:var(--shadow); max-width:calc(100% - 40px); text-align:center;
}

body:not([data-mode="admin"]) .admin-only{display:none !important}
body[data-brief="on"] .admin-only,
body[data-brief="on"] .banner,
body[data-brief="on"] .seg--hdr,
body[data-brief="on"] .vbar__a,
body[data-brief="on"] .c-act,
body[data-brief="on"] th.c-act{display:none !important}
body[data-brief="on"] .tile__v{font-size:clamp(2rem,4.2vw,2.7rem)}
body[data-brief="on"] .tile{padding:1.35rem 1.4rem 1.5rem}
body[data-brief="on"] .tile__l{font-size:.875rem}
body[data-brief="on"] .lede{font-size:1.125rem}
body[data-brief="on"] table{font-size:.875rem}

@media (max-width:1080px){ .split{grid-template-columns:minmax(0,1fr)} }
@media (max-width:620px){
  .wrap,.hdr__in,.vbar__in{padding-inline:16px}
  .hdr h1{font-size:1rem}
  .spec>div{grid-template-columns:1fr; gap:.05rem}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
@media print{
  .hdr__tools,.vbar,.card__a,.tfootbar,#slot,.c-act,th.c-act{display:none !important}
  body{background:#fff; color:#000}
  .hdr{background:#152C7C !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .wrap{max-width:none; padding:0}
  .card,.tile,.viewer{border-color:#bbb; box-shadow:none; break-inside:avoid}
  .card__h,thead th{background:#fff}
  .vid__stage{display:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr__in">
    <div class="hdr__brand">
      <div class="hdr__mark" id="mark">SP</div>
      <div>
        <h1 id="coTitle">에스피시스템스 마케팅 허브</h1>
        <p class="hdr__sub">회사소개 · 홍보 영상 · 구축 사례 <span class="stamp" id="stamp"></span></p>
      </div>
    </div>
    <div class="hdr__tools">
      <div class="seg seg--hdr" role="group" aria-label="사용 모드">
        <button type="button" id="modeUser" aria-pressed="true">사용자</button>
        <button type="button" id="modeAdmin" aria-pressed="false">관리자</button>
      </div>
      <button class="hbtn" id="briefBtn" type="button" aria-pressed="false">브리핑 화면</button>
    </div>
  </div>
</header>

<div class="vbar">
  <div class="vbar__in">
    <div class="seg" id="views" role="tablist" aria-label="영역">
      <button type="button" role="tab" data-view="dash" aria-selected="true">개요</button>
      <button type="button" role="tab" data-view="profile" aria-selected="false">회사소개서</button>
      <button type="button" role="tab" data-view="videos" aria-selected="false">영상</button>
      <button type="button" role="tab" data-view="library" aria-selected="false">자료실</button>
    </div>
    <div class="vbar__a">
      <button class="btn" id="printBtn" type="button">인쇄 · PDF</button>
      <button class="btn admin-only" id="ghBtn" type="button">깃허브 설정</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="slot"></div>

  <div class="view" id="v-dash" role="tabpanel" aria-label="개요">
    <div class="tiles" id="tiles"></div>
    <div class="split">
      <div class="col">
        <section class="card">
          <div class="card__h">
            <h2>회사 개요</h2>
            <div class="card__a admin-only"><button class="btn btn--ghost" id="editCoBtn" type="button">편집</button></div>
          </div>
          <div class="card__b">
            <p class="lede" id="coTag"></p>
            <p class="para" id="coIntro"></p>
            <div class="chips" id="coDivs"></div>
            <div class="quick">
              <button class="btn btn--primary" data-goto="profile" type="button">회사소개서 열기</button>
              <button class="btn" data-goto="videos" type="button">홍보 · 사례 영상</button>
              <button class="btn" data-goto="library" type="button">자료 다운로드</button>
            </div>
          </div>
        </section>
        <section class="card">
          <div class="card__h"><h2>주요 솔루션</h2><span class="card__m">Solution</span></div>
          <div class="card__b"><div class="chips" id="coSols" style="margin-top:0"></div></div>
        </section>
      </div>
      <aside class="rail">
        <section class="card">
          <div class="card__h"><h2>회사 정보</h2></div>
          <div class="card__b"><dl class="spec" id="coSpec"></dl></div>
        </section>
      </aside>
    </div>
  </div>

  <div class="view" id="v-profile" role="tabpanel" aria-label="회사소개서" hidden>
    <div class="split">
      <div class="col">
        <section class="card">
          <div class="card__h">
            <h2>회사소개서</h2><span class="card__m" id="introName"></span>
            <div class="card__a admin-only">
              <button class="btn btn--primary" data-upload="intro" type="button">＋ 새 버전 올리기</button>
            </div>
          </div>
          <div class="card__b"><div class="viewer" id="introViewer"></div></div>
        </section>
      </div>
      <aside class="rail" id="introMeta"></aside>
    </div>
  </div>

  <div class="view" id="v-videos" role="tabpanel" aria-label="영상" hidden>
    <section class="card">
      <div class="card__h">
        <h2>회사 영상</h2><span class="card__m" id="ytLink"></span>
        <div class="card__a admin-only">
          <button class="btn" data-addvideo="promo" type="button">＋ 홍보 영상</button>
          <button class="btn" data-addvideo="result" type="button">＋ 사례 영상</button>
        </div>
      </div>
      <div class="card__b">
        <div class="subh"><h3>홍보 영상</h3><span class="hint" id="promoCnt"></span></div>
        <div class="vids" id="promoVids"></div>
        <div class="subh" style="margin-top:1.6rem"><h3>구축 사례 영상</h3><span class="hint" id="resultCnt"></span></div>
        <div class="vids" id="resultVids"></div>
      </div>
    </section>
  </div>

  <div class="view" id="v-library" role="tabpanel" aria-label="자료실" hidden>
    <section class="card">
      <div class="card__h">
        <h2>자료실</h2><span class="card__m">공개 자료</span>
        <div class="card__a admin-only">
          <button class="btn" data-upload="logo" type="button">＋ 로고</button>
          <button class="btn" data-upload="etc" type="button">＋ 기타 자료</button>
        </div>
      </div>
      <div class="tblwrap" id="libTable"></div>
      <div class="tfootbar" id="libFoot"></div>
    </section>
  </div>

  <section class="card" style="margin-top:1rem">
    <div class="card__h"><h2>문의</h2></div>
    <div class="card__b">
      <dl class="spec" id="footSpec" style="max-width:460px"></dl>
      <p class="hint" id="footNote" style="margin-top:.9rem"></p>
    </div>
  </section>
</main>

<div id="modalRoot"></div>
<input type="file" id="filePicker" hidden>

<script>
(function () {
  "use strict";

  var VIEWS = ["dash", "profile", "videos", "library"];
  var LIB = [{ k: "logo", l: "회사 로고" }, { k: "etc", l: "기타 자료" }];
  var state = {
    company: {}, videos: [], files: [],
    mode: "user", view: "dash", openVideo: {},
    gh: { owner: "", repo: "", branch: "main", token: "" },
    sha: {}
  };
  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- utils ---------------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function bytes(b) {
    b = num(b);
    if (!b) return "—";
    if (b < 1024) return b + " B";
    if (b < 1048576) return (b / 1024).toFixed(0) + " KB";
    return (b / 1048576).toFixed(1) + " MB";
  }
  function extOf(n) { var m = /\.([A-Za-z0-9]+)$/.exec(String(n || "")); return m ? m[1].toLowerCase() : ""; }
  function dateOnly(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return isNaN(d.getTime()) ? "—" : d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function ytId(raw) {
    var s = String(raw || "").trim();
    if (!s) return "";
    var m = /(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{6,})/.exec(s);
    if (m) return m[1];
    return /^[A-Za-z0-9_-]{6,}$/.test(s) ? s : "";
  }
  function byOrder(a, b) { return num(a.order) - num(b.order); }
  function nextOrder(rows) { var mx = 0; rows.forEach(function (r) { mx = Math.max(mx, num(r.order)); }); return mx + 10; }
  function newId(p) { return p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function nowIso() { return new Date().toISOString(); }
  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); return null; }
    catch (e) { return null; }
  }
  var toastT = null;
  function toast(msg, ms) {
    var el = $("toastEl");
    if (!el) {
      el = document.createElement("div");
      el.className = "toast"; el.id = "toastEl"; el.setAttribute("role", "status");
      document.body.appendChild(el);
    }
    el.textContent = msg;
    clearTimeout(toastT);
    toastT = setTimeout(function () { if (el) el.remove(); }, ms || 4000);
  }

  /* base64 <-> UTF-8 / bytes */
  function b64FromBytes(bytesArr) {
    var s = "", chunk = 0x8000;
    for (var i = 0; i < bytesArr.length; i += chunk) {
      s += String.fromCharCode.apply(null, bytesArr.subarray(i, i + chunk));
    }
    return btoa(s);
  }
  function b64FromText(t) { return b64FromBytes(new TextEncoder().encode(t)); }
  function textFromB64(b) {
    var bin = atob(String(b).replace(/\s/g, ""));
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(arr);
  }

  /* ---------------- GitHub ---------------- */
  function detectRepo() {
    var saved = ls("sp-gh");
    if (saved) {
      try {
        var o = JSON.parse(saved);
        state.gh.owner = o.owner || ""; state.gh.repo = o.repo || "";
        state.gh.branch = o.branch || "main";
      } catch (e) { /* ignore malformed */ }
    }
    state.gh.token = ls("sp-gh-token") || "";
    if (state.gh.owner && state.gh.repo) return;
    var h = location.hostname, parts = location.pathname.split("/").filter(Boolean);
    var m = /^([a-z0-9-]+)\.github\.io$/i.exec(h);
    if (m) {
      state.gh.owner = m[1];
      state.gh.repo = parts.length ? parts[0] : m[1] + ".github.io";
    }
  }
  function ghSaveCfg() {
    ls("sp-gh", JSON.stringify({ owner: state.gh.owner, repo: state.gh.repo, branch: state.gh.branch }));
    if (state.gh.token) ls("sp-gh-token", state.gh.token);
  }
  function ghReady() { return !!(state.gh.owner && state.gh.repo && state.gh.token); }
  function ghUrl(path) {
    return "https://api.github.com/repos/" + state.gh.owner + "/" + state.gh.repo + "/contents/" + path;
  }
  function ghHeaders() {
    return {
      "Authorization": "Bearer " + state.gh.token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
  }
  function ghGet(path) {
    return fetch(ghUrl(path) + "?ref=" + encodeURIComponent(state.gh.branch),
      { headers: ghHeaders(), cache: "no-store" })
      .then(function (r) {
        if (r.status === 404) return null;
        if (!r.ok) return r.json().then(function (j) { throw ghErr(r.status, j); });
        return r.json();
      });
  }
  function ghPut(path, contentB64, sha, message) {
    var body = { message: message, content: contentB64, branch: state.gh.branch };
    if (sha) body.sha = sha;
    return fetch(ghUrl(path), { method: "PUT", headers: ghHeaders(), body: JSON.stringify(body) })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw ghErr(r.status, j);
          return j;
        });
      });
  }
  function ghDel(path, sha, message) {
    return fetch(ghUrl(path), {
      method: "DELETE", headers: ghHeaders(),
      body: JSON.stringify({ message: message, sha: sha, branch: state.gh.branch })
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (j) { throw ghErr(r.status, j); });
      return true;
    });
  }
  function ghErr(status, j) {
    var msg = (j && j.message) || "요청이 실패했습니다";
    if (status === 401) msg = "토큰이 유효하지 않습니다. 깃허브 설정에서 다시 입력해 주세요.";
    else if (status === 403) msg = "권한이 없습니다. 토큰에 이 저장소의 Contents 쓰기 권한이 있는지 확인해 주세요.";
    else if (status === 404) msg = "저장소나 경로를 찾을 수 없습니다. 깃허브 설정을 확인해 주세요.";
    else if (status === 409) msg = "다른 사람이 먼저 수정했습니다. 새로 고친 뒤 다시 시도해 주세요.";
    else if (status === 422) msg = "파일이 너무 크거나 형식이 맞지 않습니다.";
    return { code: "gh", status: status, message: msg };
  }

  /* 데이터 JSON 저장: 항상 최신 sha를 읽어 덮어씀.
     저장 성공 시 화면을 로컬 상태로 즉시 갱신한다. Pages 재빌드가 끝나기 전에
     다시 fetch하면 옛 JSON을 받아 화면이 되돌아가기 때문이다. */
  function saveJson(name, obj, message) {
    var path = "data/" + name + ".json";
    return ghGet(path).then(function (cur) {
      obj.updatedAt = nowIso();
      var txt = JSON.stringify(obj, null, 2) + "\n";
      return ghPut(path, b64FromText(txt), cur && cur.sha, message);
    }).then(function () {
      applyLocal(name, obj);
      renderAll();
      toast("깃허브에 저장했습니다. 공개 사이트 반영까지 30초~1분 걸립니다.", 5000);
    });
  }
  function applyLocal(name, obj) {
    if (name === "company") state.company = obj;
    else if (name === "videos") state.videos = (obj.items || []).slice().sort(byOrder);
    else if (name === "files") state.files = (obj.items || []).slice().sort(byOrder);
  }

  /* ---------------- 읽기 ---------------- */
  function loadAll() {
    var bust = "?v=" + Date.now();
    return Promise.all([
      fetch("data/company.json" + bust, { cache: "no-store" }).then(okJson).catch(function () { return {}; }),
      fetch("data/videos.json" + bust, { cache: "no-store" }).then(okJson).catch(function () { return { items: [] }; }),
      fetch("data/files.json" + bust, { cache: "no-store" }).then(okJson).catch(function () { return { items: [] }; })
    ]).then(function (r) {
      state.company = r[0] || {};
      state.videos = (r[1] && r[1].items ? r[1].items : []).slice().sort(byOrder);
      state.files = (r[2] && r[2].items ? r[2].items : []).slice().sort(byOrder);
      renderAll();
    });
  }
  function okJson(r) { if (!r.ok) throw new Error(r.status); return r.json(); }

  /* ---------------- view / mode ---------------- */
  function showView(n) {
    if (VIEWS.indexOf(n) === -1) n = "dash";
    state.view = n;
    VIEWS.forEach(function (v) { $("v-" + v).hidden = v !== n; });
    $("views").querySelectorAll("button").forEach(function (b) {
      b.setAttribute("aria-selected", String(b.getAttribute("data-view") === n));
    });
    if (location.hash !== "#" + n) history.replaceState(null, "", "#" + n);
  }
  function applyMode() {
    document.body.setAttribute("data-mode", state.mode);
    $("modeUser").setAttribute("aria-pressed", String(state.mode !== "admin"));
    $("modeAdmin").setAttribute("aria-pressed", String(state.mode === "admin"));
  }
  function setMode(m) {
    if (m === "admin" && !ghReady()) {
      state.mode = "admin"; applyMode(); renderAll(); openGhCfg(true); return;
    }
    state.mode = m; ls("sp-mode", m); applyMode(); renderAll();
  }

  function slotNote(html, warn) {
    $("slot").innerHTML = '<div class="banner' + (warn ? " banner--warn" : "") + '" role="status">' + html + "</div>";
  }
  function refreshSlot() {
    if (state.mode !== "admin") { $("slot").innerHTML = ""; return; }
    if (!ghReady()) {
      slotNote("<strong>관리자 모드</strong> — 깃허브 저장소와 토큰이 설정되지 않아 저장할 수 없습니다. " +
        '<button class="btn banner__sp" id="cfgNow" type="button">깃허브 설정</button>', true);
      var b = $("cfgNow");
      if (b) b.addEventListener("click", function () { openGhCfg(false); });
    } else {
      slotNote("<strong>관리자 모드</strong> — 수정 내용은 <code>" + esc(state.gh.owner) + "/" +
        esc(state.gh.repo) + "</code> 저장소에 커밋됩니다. 사이트 반영까지 30초~1분 걸립니다.");
    }
  }

  /* ---------------- render ---------------- */
  function renderAll() {
    renderCompany(); renderTiles(); renderProfile(); renderVideos(); renderLibrary(); refreshSlot();
  }
  function spec(pairs) {
    return pairs.filter(function (p) { return p[1]; }).map(function (p) {
      return "<div><dt>" + esc(p[0]) + "</dt><dd>" + p[1] + "</dd></div>";
    }).join("");
  }
  function chipsOf(str) {
    return String(str || "").split(/[·,]/).map(function (s) { return s.trim(); }).filter(Boolean)
      .map(function (d) { return '<span class="chip">' + esc(d) + "</span>"; }).join("");
  }
  function renderCompany() {
    var co = state.company || {};
    if (co.name) {
      $("coTitle").textContent = co.name + " 마케팅 허브";
      document.title = co.name + " 마케팅 허브";
    }
    $("coTag").textContent = co.tagline || "";
    $("coIntro").textContent = co.intro || "";
    $("coDivs").innerHTML = chipsOf(co.business);
    $("coSols").innerHTML = chipsOf(co.solutions) || '<span class="hint">등록된 솔루션이 없습니다.</span>';
    var mark = $("mark");
    if (co.logoPath) mark.innerHTML = '<img src="' + esc(co.logoPath) + '" alt="">';
    else if (co.name) mark.textContent = co.name.slice(0, 2);
    $("stamp").textContent = co.updatedAt ? "· 최종 갱신 " + dateOnly(co.updatedAt) : "";

    var web = co.website ? '<a href="' + esc(/^https?:/.test(co.website) ? co.website : "https://" + co.website) +
      '" target="_blank" rel="noopener">' + esc(co.website) + "</a>" : "";
    $("coSpec").innerHTML = spec([
      ["설립", esc(co.since)], ["대표", esc(co.ceo)], ["상장", esc(co.listing)],
      ["사업부문", esc(co.business)], ["본사", esc(co.address)], ["웹", web]
    ]);
    $("footSpec").innerHTML = spec([
      ["대표 전화", co.phone ? '<a href="tel:' + esc(String(co.phone).replace(/[^0-9+]/g, "")) + '">' + esc(co.phone) + "</a>" : ""],
      ["이메일", co.email ? '<a href="mailto:' + esc(co.email) + '">' + esc(co.email) + "</a>" : ""],
      ["웹사이트", web], ["주소", esc(co.address)]
    ]);
    $("footNote").textContent = co.name
      ? co.name + " 마케팅 자료 공개 페이지입니다. 고객사 미팅에서는 우측 상단 ‘브리핑 화면’으로 조작 요소를 감추고 보여주세요."
      : "";
    $("ytLink").innerHTML = co.youtube
      ? '<a href="' + esc(co.youtube) + '" target="_blank" rel="noopener">채널 전체 보기 ↗</a>' : "";
  }
  function renderTiles() {
    var co = state.company || {};
    var since = parseInt(String(co.since || "").replace(/[^0-9]/g, ""), 10);
    var years = since ? (new Date().getFullYear() - since) : null;
    var items = [
      { label: "사업 연속", value: years != null ? years : "—", unit: years != null ? "년" : "", note: co.since || "" },
      { label: "사업부문", value: String(co.business || "").split(/[·,]/).filter(function (s) { return s.trim(); }).length, unit: "개", note: "로보틱스 · ICT · 배터리" },
      { label: "공개 영상", value: state.videos.length, unit: "편", note: "홍보 · 구축 사례" },
      { label: "공개 자료", value: state.files.length, unit: "건", note: "소개서 · 로고 · 기타" }
    ];
    $("tiles").innerHTML = items.map(function (k) {
      return '<div class="tile"><div class="tile__l">' + esc(k.label) + "</div>" +
        '<div class="tile__v"><span>' + esc(k.value) + "</span>" +
        (k.unit ? '<span class="tile__u">' + esc(k.unit) + "</span>" : "") + "</div>" +
        (k.note ? '<div class="tile__n">' + esc(k.note) + "</div>" : "") + "</div>";
    }).join("");
  }

  function renderProfile() {
    var intros = state.files.filter(function (f) { return f.category === "intro"; });
    var main = intros[0], admin = state.mode === "admin";
    var viewer = $("introViewer"), meta = $("introMeta");
    $("introName").textContent = main ? (main.filename || "") : "";
    if (!main) {
      viewer.innerHTML = '<div class="viewer__fall">' +
        (admin ? "회사소개서 PDF를 올리면 이 자리에서 바로 넘겨볼 수 있습니다."
               : "아직 등록된 회사소개서가 없습니다.") + "</div>";
      meta.innerHTML = "";
      return;
    }
    var isPdf = extOf(main.filename) === "pdf";
    viewer.innerHTML = isPdf
      ? '<iframe src="' + esc(main.path) + '#view=FitH" title="' + esc(main.title || "회사소개서") + '" loading="lazy"></iframe>'
      : '<div class="viewer__fall">이 형식은 화면 미리보기를 지원하지 않습니다. 오른쪽에서 내려받아 확인하세요.</div>';
    var rest = intros.slice(1);
    meta.innerHTML =
      '<section class="card"><div class="card__h"><h2>문서 정보</h2></div><div class="card__b">' +
        '<p class="lede">' + esc(main.title || "회사소개서") + "</p>" +
        '<p class="para">' + esc(main.desc || "현재 최신 버전입니다.") + "</p>" +
        '<div class="meta">' + esc(main.filename || "") + " · " + bytes(main.sizeBytes) + " · " + dateOnly(main.updatedAt) + "</div>" +
        '<div class="acts"><a class="btn btn--primary" href="' + esc(main.path) + '" download>다운로드</a>' +
        '<a class="btn" href="' + esc(main.path) + '" target="_blank" rel="noopener">새 탭에서 열기</a></div>' +
      "</div></section>" +
      (rest.length ? '<section class="card"><div class="card__h"><h2>다른 버전</h2><span class="card__m">' +
        rest.length + '건</span></div><div class="card__b">' + rest.map(function (f) {
          return '<div class="frow"><span class="frow__n">' + esc(f.title || f.filename) + "</span>" +
            '<span class="frow__s">' + bytes(f.sizeBytes) + "</span>" +
            '<a class="btn btn--ghost" href="' + esc(f.path) + '" download>받기</a>' +
            (admin ? '<button class="btn btn--ghost btn--danger" data-delfile="' + esc(f.id) + '" type="button">삭제</button>' : "") +
            "</div>";
        }).join("") + "</div></section>" : "") +
      (admin ? '<section class="card admin-only"><div class="card__h"><h2>관리</h2>' +
        '<span class="adminlab">· 관리자 전용</span></div><div class="card__b">' +
        '<p class="hint">새 PDF를 올리면 맨 위 버전으로 올라갑니다.</p><div class="acts">' +
        '<button class="btn" data-editfile="' + esc(main.id) + '" type="button">정보 수정</button>' +
        '<button class="btn btn--danger" data-delfile="' + esc(main.id) + '" type="button">현재 버전 삭제</button>' +
        "</div></div></section>" : "");
  }

  function renderVideos() {
    var admin = state.mode === "admin";
    [["promo", "promoVids", "promoCnt"], ["result", "resultVids", "resultCnt"]].forEach(function (t) {
      var kind = t[0], host = $(t[1]);
      var rows = state.videos.filter(function (v) { return (v.kind || "promo") === kind; });
      $(t[2]).textContent = rows.length ? rows.length + "편" : "";
      if (!rows.length) {
        host.innerHTML = '<div class="empty" style="grid-column:1/-1">' +
          (admin ? "<p>유튜브 링크만 붙여넣으면 바로 재생됩니다.</p>" +
                   '<button class="btn" data-addvideo="' + kind + '" type="button">＋ 영상 추가</button>'
                 : "아직 등록된 영상이 없습니다.") + "</div>";
        return;
      }
      host.innerHTML = rows.map(function (v) {
        var id = ytId(v.youtubeId), open = state.openVideo[v.id] && id;
        var stage = open
          ? '<div class="vid__stage"><iframe src="https://www.youtube-nocookie.com/embed/' + esc(id) +
            '?rel=0&autoplay=1" title="' + esc(v.title || "영상") +
            '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>'
          : '<button class="vid__stage" type="button" data-play="' + esc(v.id) + '" aria-label="' +
            esc((v.title || "영상") + " 재생") + '"' + (id ? "" : " disabled") + ">" +
            (id ? '<img src="https://i.ytimg.com/vi/' + esc(id) + '/hqdefault.jpg" alt="" loading="lazy">' : "") +
            '<span class="vid__play" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">' +
            '<path d="M5 2.5 L15 9 L5 15.5 Z"></path></svg></span></button>';
        return '<article class="vid">' + stage + '<div class="vid__b"><h3>' + esc(v.title || "제목 없음") + "</h3>" +
          (v.desc ? "<p>" + esc(v.desc) + "</p>" : "") + '<div class="vid__f">' +
          (id ? '<a href="https://www.youtube.com/watch?v=' + esc(id) + '" target="_blank" rel="noopener">YouTube에서 열기 ↗</a>'
              : '<span class="hint">유튜브 링크가 아직 없습니다</span>') +
          (admin ? '<span style="margin-left:auto;display:flex;gap:.3rem">' +
            '<button class="btn btn--ghost" data-editvideo="' + esc(v.id) + '" type="button">수정</button>' +
            '<button class="btn btn--ghost btn--danger" data-delvideo="' + esc(v.id) + '" type="button">삭제</button></span>' : "") +
          "</div></div></article>";
      }).join("");
    });
  }

  function renderLibrary() {
    var wrap = $("libTable"), admin = state.mode === "admin";
    var rows = state.files.filter(function (f) { return f.category !== "intro"; });
    if (!rows.length) {
      wrap.innerHTML = '<div class="empty" style="border:0;border-radius:0">' +
        (admin ? "<p>외부에 공개할 로고나 자료를 올려주세요.</p>" +
            '<button class="btn" data-upload="logo" type="button">＋ 파일 올리기</button>'
          : "아직 등록된 자료가 없습니다.") + "</div>";
      $("libFoot").textContent = ""; return;
    }
    var lab = function (k) {
      for (var i = 0; i < LIB.length; i++) if (LIB[i].k === k) return LIB[i].l;
      return "기타 자료";
    };
    wrap.innerHTML = '<table class="t--files"><thead><tr><th>분류</th><th>자료명</th><th>형식</th>' +
      '<th style="text-align:right">크기</th><th>등록일</th><th style="text-align:right">받기</th>' +
      (admin ? '<th class="c-act admin-only">관리</th>' : "") + "</tr></thead><tbody>" +
      rows.map(function (f) {
        return "<tr><td>" + esc(lab(f.category)) + "</td>" +
          '<td class="c-name" style="white-space:normal">' + esc(f.title || f.filename) +
            (f.desc ? '<div class="hint" style="margin-top:.2rem;font-weight:400">' + esc(f.desc) + "</div>" : "") +
            '<div class="meta">' + esc(f.filename || "") + "</div></td>" +
          '<td><span class="ext">' + esc((extOf(f.filename) || "file").toUpperCase()) + "</span></td>" +
          '<td class="c-num">' + bytes(f.sizeBytes) + "</td>" +
          '<td class="c-num">' + dateOnly(f.updatedAt) + "</td>" +
          '<td class="c-act"><a class="btn" href="' + esc(f.path) + '" download>다운로드</a> ' +
            '<a class="btn btn--ghost" href="' + esc(f.path) + '" target="_blank" rel="noopener">열기</a></td>' +
          (admin ? '<td class="c-act admin-only">' +
            '<button class="btn btn--ghost" data-editfile="' + esc(f.id) + '" type="button">수정</button>' +
            '<button class="btn btn--ghost btn--danger" data-delfile="' + esc(f.id) + '" type="button">삭제</button></td>' : "") +
          "</tr>";
      }).join("") + "</tbody></table>";
    var tb = 0; rows.forEach(function (f) { tb += num(f.sizeBytes); });
    $("libFoot").textContent = rows.length + "개 자료 · 합계 " + bytes(tb);
  }

  /* ---------------- modal ---------------- */
  var lastFocus = null;
  function closeModal() {
    $("modalRoot").innerHTML = "";
    document.removeEventListener("keydown", escClose);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function escClose(e) { if (e.key === "Escape") closeModal(); }
  function openModal(title, body, onSave, saveLabel, noCancel) {
    lastFocus = document.activeElement;
    $("modalRoot").innerHTML =
      '<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) +
      '"><div class="modal__h"><h3>' + esc(title) + "</h3>" +
      '<button class="btn btn--ghost" id="mClose" type="button">✕</button></div>' +
      '<div class="modal__b" id="mBody">' + body + "</div>" +
      '<div class="modal__f"><span class="modal__sp"></span>' +
      (noCancel ? "" : '<button class="btn" id="mCancel" type="button">취소</button>') +
      '<button class="btn btn--primary" id="mSave" type="button">' + esc(saveLabel || "저장") +
      "</button></div></div></div>";
    $("mClose").addEventListener("click", closeModal);
    if (!noCancel) $("mCancel").addEventListener("click", closeModal);
    $("scrim").addEventListener("mousedown", function (e) { if (e.target.id === "scrim") closeModal(); });
    $("mSave").addEventListener("click", function () {
      var btn = $("mSave"); btn.disabled = true; btn.textContent = "저장 중…";
      Promise.resolve().then(onSave).then(closeModal)
        ["catch"](function (err) {
          btn.disabled = false; btn.textContent = saveLabel || "저장";
          toast((err && err.message) || "저장하지 못했습니다.", 6000);
        });
    });
    document.addEventListener("keydown", escClose);
    var first = $("mBody").querySelector("input,select,textarea");
    if (first) first.focus();
  }
  function field(f, val) {
    var id = "fx-" + f.k, v = val == null ? "" : val, inner;
    if (f.t === "textarea") inner = '<textarea id="' + id + '" data-k="' + f.k + '">' + esc(v) + "</textarea>";
    else if (f.t === "select") {
      inner = '<select id="' + id + '" data-k="' + f.k + '">' + f.opts.map(function (o) {
        return '<option value="' + esc(o[0]) + '"' + (String(v) === String(o[0]) ? " selected" : "") +
          ">" + esc(o[1]) + "</option>";
      }).join("") + "</select>";
    } else {
      inner = '<input type="' + (f.t === "password" ? "password" : "text") + '" id="' + id + '" data-k="' + f.k +
        '" value="' + esc(v) + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : "") + ">";
    }
    return '<div class="fld"><label for="' + id + '">' + esc(f.l) + "</label>" + inner +
      (f.h ? '<span class="fld__h">' + f.h + "</span>" : "") + "</div>";
  }
  function collect() {
    var out = {};
    $("mBody").querySelectorAll("[data-k]").forEach(function (el) {
      out[el.getAttribute("data-k")] = el.value.trim();
    });
    return out;
  }

  /* ---------------- 깃허브 설정 ---------------- */
  function openGhCfg(firstRun) {
    var g = state.gh;
    var help = '<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">' +
      "Fine-grained 토큰 발급 ↗</a> · 이 저장소만 선택하고 <b>Contents: Read and write</b> 권한을 주세요. " +
      "토큰은 이 브라우저에만 저장되고 사이트에는 올라가지 않습니다.";
    openModal(firstRun ? "깃허브 설정이 필요합니다" : "깃허브 설정",
      (firstRun ? '<p class="hint">관리자 모드에서 수정한 내용을 저장하려면 저장소와 토큰이 필요합니다.</p>' : "") +
      field({ k: "owner", l: "계정 / 조직", ph: "your-github-id" }, g.owner) +
      field({ k: "repo", l: "저장소 이름", ph: "sp-marketing-hub" }, g.repo) +
      field({ k: "branch", l: "브랜치" }, g.branch || "main") +
      field({ k: "token", l: "개인 액세스 토큰", t: "password", ph: "github_pat_…", h: help }, g.token),
      function () {
        var d = collect();
        if (!d.owner || !d.repo) throw { message: "계정과 저장소 이름을 입력해 주세요." };
        if (!d.token) throw { message: "토큰을 입력해 주세요." };
        state.gh.owner = d.owner; state.gh.repo = d.repo;
        state.gh.branch = d.branch || "main"; state.gh.token = d.token;
        return ghGet("data/company.json").then(function () {
          ghSaveCfg(); ls("sp-mode", "admin");
          toast("연결했습니다. 이제 화면에서 수정하면 깃허브에 커밋됩니다.");
          refreshSlot();
        });
      }, "연결 확인");
  }

  /* ---------------- 편집 ---------------- */
  var CO_FIELDS = [
    { k: "name", l: "회사명" },
    { k: "tagline", l: "한 줄 소개" },
    { k: "intro", l: "회사 설명", t: "textarea" },
    { k: "since", l: "설립" }, { k: "ceo", l: "대표" },
    { k: "listing", l: "상장" },
    { k: "business", l: "사업부문", h: "‘·’ 로 구분하면 칩으로 표시됩니다" },
    { k: "solutions", l: "주요 솔루션", h: "‘·’ 로 구분" },
    { k: "phone", l: "대표 전화" }, { k: "email", l: "대표 이메일" },
    { k: "website", l: "웹사이트" }, { k: "address", l: "본사 주소" },
    { k: "youtube", l: "유튜브 채널 주소" }
  ];
  function editCompany() {
    var co = state.company || {};
    var logos = state.files.filter(function (f) { return f.category === "logo"; });
    var html = CO_FIELDS.map(function (f) { return field(f, co[f.k]); }).join("") +
      '<div class="fld"><label for="fx-logoPath">헤더 로고</label>' +
      '<select id="fx-logoPath" data-k="logoPath"><option value="">머리글자 사용</option>' +
      logos.map(function (f) {
        return '<option value="' + esc(f.path) + '"' + (co.logoPath === f.path ? " selected" : "") +
          ">" + esc(f.title || f.filename) + "</option>";
      }).join("") + '</select><span class="fld__h">자료실 ‘회사 로고’에 올린 이미지 중에서 고릅니다.</span></div>';
    openModal("회사 정보", html, function () {
      return saveJson("company", Object.assign({}, co, collect()), "회사 정보 수정");
    });
  }
  function videoById(id) {
    for (var i = 0; i < state.videos.length; i++) if (state.videos[i].id === id) return state.videos[i];
    return null;
  }
  function editVideo(id, kind) {
    var v = id ? (videoById(id) || {}) : { kind: kind || "promo" };
    var html = [
      field({ k: "title", l: "영상 제목" }, v.title),
      field({ k: "desc", l: "설명", t: "textarea" }, v.desc),
      field({ k: "youtubeId", l: "유튜브 주소 또는 영상 ID",
        h: "https://youtu.be/… 또는 https://www.youtube.com/watch?v=… 를 그대로 붙여넣으세요" }, v.youtubeId),
      field({ k: "kind", l: "분류", t: "select", opts: [["promo", "홍보 영상"], ["result", "구축 사례 영상"]] }, v.kind || "promo")
    ].join("");
    openModal(id ? "영상 수정" : "영상 추가", html, function () {
      var d = collect(), parsed = ytId(d.youtubeId);
      if (!parsed) throw { message: "유튜브 주소를 확인해 주세요." };
      d.youtubeId = parsed;
      var items = state.videos.slice();
      if (id) {
        for (var i = 0; i < items.length; i++) {
          if (items[i].id === id) { items[i] = Object.assign({}, items[i], d); break; }
        }
      } else {
        d.id = newId("v");
        d.order = nextOrder(items.filter(function (x) { return x.kind === d.kind; }));
        items.push(d);
      }
      return saveJson("videos", { items: items }, (id ? "영상 수정: " : "영상 추가: ") + (d.title || d.youtubeId));
    });
  }
  function fileById(id) {
    for (var i = 0; i < state.files.length; i++) if (state.files[i].id === id) return state.files[i];
    return null;
  }
  function editFile(id) {
    var f = fileById(id);
    if (!f) return;
    var html = [
      field({ k: "title", l: "표시 이름" }, f.title),
      field({ k: "desc", l: "설명", t: "textarea" }, f.desc),
      field({ k: "category", l: "분류", t: "select",
        opts: [["intro", "회사소개서"]].concat(LIB.map(function (g) { return [g.k, g.l]; })) }, f.category)
    ].join("") + '<p class="fld__h">파일 자체를 바꾸려면 새로 올린 뒤 이전 항목을 삭제하세요. 현재 파일: ' +
      esc(f.filename || "") + "</p>";
    openModal("자료 정보 수정", html, function () {
      var d = collect(), items = state.files.slice();
      for (var i = 0; i < items.length; i++) {
        if (items[i].id === id) { items[i] = Object.assign({}, items[i], d, { updatedAt: nowIso() }); break; }
      }
      return saveJson("files", { items: items }, "자료 정보 수정: " + (d.title || f.filename));
    });
  }
  function delVideo(id) {
    var v = videoById(id) || {};
    openModal("삭제 확인", '<p style="font-size:.875rem">영상 ‘' + esc(v.title || "제목 없음") +
      "’ 을 목록에서 지웁니다. 유튜브의 원본 영상은 지워지지 않습니다.</p>", function () {
      return saveJson("videos", {
        items: state.videos.filter(function (x) { return x.id !== id; })
      }, "영상 삭제: " + (v.title || id));
    }, "삭제");
  }
  function delFile(id) {
    var f = fileById(id);
    if (!f) return;
    openModal("삭제 확인", '<p style="font-size:.875rem">자료 ‘' + esc(f.title || f.filename) +
      "’ 과 저장소의 파일을 함께 지웁니다. 되돌릴 수 없습니다.</p>", function () {
      return saveJson("files", {
        items: state.files.filter(function (x) { return x.id !== id; })
      }, "자료 삭제: " + (f.title || f.filename)).then(function () {
        if (!f.path) return true;
        return ghGet(f.path).then(function (cur) {
          if (!cur || !cur.sha) return true;
          return ghDel(f.path, cur.sha, "파일 삭제: " + f.filename);
        })["catch"](function () { return true; });
      });
    }, "삭제");
  }

  /* ---------------- 업로드 ---------------- */
  var pending = null;
  function pickFile(category) {
    if (!ghReady()) { openGhCfg(false); return; }
    pending = category;
    var p = $("filePicker");
    p.value = ""; p.accept = category === "intro" ? ".pdf" : "";
    p.click();
  }
  $("filePicker").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0], category = pending;
    pending = null;
    if (!file || !category) return;
    if (file.size > 24 * 1024 * 1024) {
      toast("파일이 너무 큽니다. 깃허브 API로는 24MB 이하만 올릴 수 있습니다.", 6000); return;
    }
    var safe = file.name.replace(/[^\w.\-가-힣]+/g, "_");
    var path = "files/" + safe;
    toast(file.name + " 올리는 중…", 20000);
    file.arrayBuffer().then(function (buf) {
      return ghGet(path).then(function (cur) {
        return ghPut(path, b64FromBytes(new Uint8Array(buf)), cur && cur.sha, "파일 업로드: " + safe);
      });
    }).then(function () {
      var items = state.files.slice();
      var row = {
        id: newId("f"), title: file.name.replace(/\.[^.]+$/, ""), desc: "",
        category: category, path: path, filename: safe,
        sizeBytes: file.size, updatedAt: nowIso(),
        order: category === "intro"
          ? (items.filter(function (x) { return x.category === "intro"; }).reduce(function (m, x) {
              return Math.min(m, num(x.order)); }, 10) - 10)
          : nextOrder(items.filter(function (x) { return x.category === category; }))
      };
      items.push(row);
      return saveJson("files", { items: items }, "자료 등록: " + safe);
    }).then(function () {
      toast("올렸습니다. 제목과 설명은 ‘수정’에서 다듬을 수 있습니다. 공개 사이트 반영까지 30초~1분.", 6000);
    })["catch"](function (err) {
      toast((err && err.message) || "업로드에 실패했습니다.", 6000);
    });
  });

  /* ---------------- 이벤트 ---------------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-goto],[data-play],[data-upload],[data-addvideo]," +
      "[data-editvideo],[data-delvideo],[data-editfile],[data-delfile]");
    if (!t) return;
    var g = function (k) { return t.getAttribute(k); };
    if (g("data-goto")) { showView(g("data-goto")); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    if (g("data-play")) { state.openVideo[g("data-play")] = true; renderVideos(); return; }
    if (g("data-upload")) { pickFile(g("data-upload")); return; }
    if (g("data-addvideo")) { editVideo(null, g("data-addvideo")); return; }
    if (g("data-editvideo")) { editVideo(g("data-editvideo")); return; }
    if (g("data-delvideo")) { delVideo(g("data-delvideo")); return; }
    if (g("data-editfile")) { editFile(g("data-editfile")); return; }
    if (g("data-delfile")) { delFile(g("data-delfile")); return; }
  });

  $("views").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-view]");
    if (b) showView(b.getAttribute("data-view"));
  });
  $("editCoBtn").addEventListener("click", editCompany);
  $("ghBtn").addEventListener("click", function () { openGhCfg(false); });
  $("printBtn").addEventListener("click", function () { window.print(); });
  $("modeUser").addEventListener("click", function () { setMode("user"); });
  $("modeAdmin").addEventListener("click", function () { setMode("admin"); });
  $("briefBtn").addEventListener("click", function () {
    var on = document.body.getAttribute("data-brief") === "on";
    document.body.setAttribute("data-brief", on ? "off" : "on");
    this.setAttribute("aria-pressed", String(!on));
    this.textContent = on ? "브리핑 화면" : "일반 화면";
    if (!on) window.scrollTo({ top: 0, behavior: "smooth" });
  });
  window.addEventListener("hashchange", function () {
    showView(String(location.hash || "").replace("#", ""));
  });

  detectRepo();
  state.mode = (ls("sp-mode") === "admin" && ghReady()) ? "admin" : "user";
  applyMode();
  showView(String(location.hash || "").replace("#", ""));
  renderAll();
  loadAll();
})();
</script>
</body>
</html>
